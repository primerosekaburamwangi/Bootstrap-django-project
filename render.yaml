services:
  - type: web
    name: bootstrapdjango
    runtime: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input
    startCommand: gunicorn bootstrapdjango.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: bootstrapdjango-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: "bootstrapdjango.onrender.com,localhost,127.0.0.1"
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "true"
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: NEWSLETTER_EMAIL
        sync: false

databases:
  - name: bootstrapdjango-db
    databaseName: bootstrapdjango
    user: bootstrapdjango
